<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klaisur Tartan</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen">
  <div class="p-4">
    <h1 class="text-3xl font-bold">Klaisur Tartan</h1>
    <p id="count" class="text-gray-400">Loading...</p>
  </div>
  <div id="grid" class="grid grid-cols-2 md:grid-cols-3 gap-4 p-4"></div>

<script>
fetch("http://localhost:8082/api/pics")
  .then(r => r.json())
  .then(d => {
    document.getElementById("count").textContent = d.count + " pics - via REST API";
    document.getElementById("grid").innerHTML = d.pics.map(p =>
      `<img src="pics/${p}" class="w-full aspect-square object-cover rounded-xl shadow-lg">`
    ).join("");
  })
  .catch(() => {
    document.getElementById("count").textContent = "API not running - start python3 api.py";
  });
</script>
</body>
</html>
