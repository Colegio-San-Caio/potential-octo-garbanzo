name: BOA84-AUTO
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
jobs:
  boa84:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: BOA84 SECRET
        run: |
          grep -R -E -n -f .boa84_secret_pat.txt --exclude-dir=.git --exclude-dir=docs --exclude-dir=website --exclude-dir=precomputer --exclude-dir=fat32_boa84 --exclude="*.abap" . 2>/dev/null | head -20 || echo "NO REAL SECRET"
      - name: BOA84 ITER
        run: |
          find . -name "main.*" -not -path "./.git/*" | head -20 | while read f; do echo "ITER $f"; done || true
      - name: BOA84 AUDIT
        run: |
          for d in website worker precomputer; do echo "--- $d ---"; (cd $d && npm audit --audit-level=high 2>&1 | tail -10 || true); done || true
