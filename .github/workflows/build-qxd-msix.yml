name: Build QxD MSIX
on:
  workflow_dispatch:

jobs:
  pack-msix:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stage package layout and generate assets
        shell: pwsh
        run: |
          $pkg = "$env:RUNNER_TEMP\qxd-pkg"
          New-Item -ItemType Directory -Force -Path "$pkg\Assets" | Out-Null
          New-Item -ItemType Directory -Force -Path "$pkg\sandbox" | Out-Null

          @'
          #include <process.h>

          int main(int argc, char **argv) {
            const char *args[128];
            int idx = 0;
            args[idx++] = "python";
            args[idx++] = "qxd_eval.py";
            for (int i = 1; i < argc && idx < 126; ++i) {
              args[idx++] = argv[i];
            }
            args[idx] = 0;
            return _spawnvp(_P_WAIT, "python", args);
          }
          '@ | Set-Content -Path "$env:RUNNER_TEMP\qxd_eval.c" -Encoding ASCII

          gcc -O2 "$env:RUNNER_TEMP\qxd_eval.c" -o "$pkg\qxd_eval.exe"
          if (-not (Test-Path "$pkg\qxd_eval.exe")) { throw "Failed to build qxd_eval.exe" }

          Copy-Item qxd_eval.py "$pkg\"
          Copy-Item test_qxd_eval.py "$pkg\"
          Copy-Item sandbox\*.qxd "$pkg\sandbox\"

          python make_qxd_msix.py
          Copy-Item qxd_layout\Assets\* "$pkg\Assets\"
          Copy-Item qxd_layout\AppxManifest.xml "$pkg\"
          Copy-Item qxd_layout\[Content_Types].xml "$pkg\"

          $manifestPath = "$pkg\AppxManifest.xml"
          $manifestText = Get-Content -Path $manifestPath -Raw
          $manifestText = $manifestText -replace 'Executable="qxd_eval\.py"', 'Executable="qxd_eval.exe"'
          $manifestText = $manifestText -replace 'Name="KaiOlafKetelhut\.QxD"', 'Name="KaiOlafKetelhut.QxDLayerL3Evaluator"'
          $manifestText = $manifestText -replace 'Publisher="CN=AB544420-238E-4D81-8809-1D4CADF99C43"', 'Publisher="CN=88544420-228E-4D31-8839-1D4CADF99C43"'
          Set-Content -Path $manifestPath -Value $manifestText -Encoding UTF8

          if ($manifestText -notmatch 'Name="KaiOlafKetelhut\.QxDLayerL3Evaluator"' -or $manifestText -notmatch 'Publisher="CN=88544420-228E-4D31-8839-1D4CADF99C43"') {
            throw "AppxManifest.xml identity mismatch"
          }
      - name: Pack MSIX using makeappx.exe
        shell: pwsh
        run: |
          $pkg = "$env:RUNNER_TEMP\qxd-pkg"
          $outMsix = Join-Path (Get-Location) "qxd.msix"
          if (Test-Path $outMsix) { Remove-Item $outMsix -Force }
          $mk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName | Select-Object -Last 1
          if (-not $mk) { throw "makeappx.exe not found" }
          & $mk.FullName pack /v /o /h SHA256 /d "$pkg" /p "$outMsix"
      - uses: actions/upload-artifact@v4
        with:
          name: qxd-msix
          path: qxd.msix
