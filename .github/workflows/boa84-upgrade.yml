name: BOA84-UPGRADE-REALTIME
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"  # every 6h - real-time, not just Monday
  workflow_dispatch:
jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: UPGRADE - website + worker + precomputer - real-time
        run: |
          npm install -g npm-check-updates
          for d in website worker precomputer; do
            echo "=== UPSCALE $d ==="
            (cd $d && ncu -u || true; npm install --legacy-peer-deps || true; npm audit fix --legacy-peer-deps || true)
          done
      - name: AUTO-COMMIT - if anything upgraded
        run: |
          git config user.name "boa84-auto"
          git config user.email "boa84-auto@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "BOA84 AUTO-UPGRADE - realtime upscaling - $(date -u +%Y-%m-%d-%H:%M)"
          git push || echo "nothing to push"
