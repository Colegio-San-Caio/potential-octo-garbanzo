name: BOA84 - Run All Mains
on: [push, pull_request]
jobs:
  boa84:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: BOA84 - Python mains + Servers
        run: |
          echo "BOA84 FAT32 KDP - 4+16+64=84"
          python3 python/main.py || true
          python3 oop/main.py || true
          python3 networking/main.py || true
          for s in web mail database application dns proxy game file print; do python3 servers/$s/main.py || true; done
      - name: BOA84 - JS Web mains
        run: |
          node javascript/main.js || true
          node nextjs/main.js || true
          node web3/main.js || true
          cat html/main.html || true
      - name: BOA84 - Compiled mains
        run: |
          go run go/main.go || true
          g++ cpp/main.cpp -o /tmp/cpp_main && /tmp/cpp_main || true
          rustc rust/src/main.rs -o /tmp/rust_main && /tmp/rust_main || true
      - name: BOA84 - Other languages
        run: |
          ruby ruby/main.rb || true
          perl perl/main.pl || true
          php php/main.php || true
          echo "BOA84 - All mains attempted"
