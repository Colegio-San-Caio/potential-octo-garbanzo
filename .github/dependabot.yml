version: 2
updates:
  # Node.js + React Native
    - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    - package-ecosystem: "npm"
    directory: "/react-native"
    schedule:
      interval: "weekly"
    - package-ecosystem: "npm"
    directory: "/nodejs"
    schedule:
      interval: "weekly"

  # Flutter / Dart
    - package-ecosystem: "pub"
    directory: "/flutter"
    schedule:
      interval: "weekly"

  # Kotlin / Gradle
    - package-ecosystem: "gradle"
    directory: "/kotlin"
    schedule:
      interval: "weekly"

  # Python (your fs/build.py)
    - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  # GitHub Actions
    - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
